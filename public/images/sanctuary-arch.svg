<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyNavy" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061026"/>
      <stop offset="55%" stop-color="#0B1F4B"/>
      <stop offset="100%" stop-color="#112A63"/>
    </linearGradient>
    <radialGradient id="sanctuaryGlow" cx="600" cy="310" r="420" gradientUnits="userSpaceOnUse">
