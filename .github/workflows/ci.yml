name: Trinity International University CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-e2e:
    name: Typecheck, Lint, Unit, Build & Production E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: ESLint verification
        run: pnpm lint

      - name: Unit & security logic tests
        run: pnpm test:unit

      - name: Production Next.js build
        run: pnpm build

      - name: Install Playwright & Chromium for production E2E
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Run full production E2E verification suite
        run: pnpm test:e2e
